<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid RPG Foundation</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="biome.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Foundation Build 015</p>
        <h1>Grid RPG Prototype</h1>
      </div>
      <button id="reset-button" class="button button-danger" type="button">Reset</button>
    </header>
    <section class="layout">
      <section class="panel world-panel" aria-labelledby="world-heading">
        <div class="panel-heading">
          <div><p class="eyebrow">World</p><h2 id="world-heading">Movement Test</h2></div>
          <span id="status-badge" class="status-badge">Ready</span>
        </div>
        <div id="grid" class="grid" aria-label="Game grid" tabindex="0"></div>
        <p class="help-text">Move with W A S D or the arrow keys. Blue is the player. Dark cells are blocked. Green cells are forest.</p>
      </section>
      <aside class="side-column">
        <section class="panel"><p class="eyebrow">Player state</p><h2>Inspector</h2><dl id="state-inspector" class="state-list"></dl></section>
        <section class="panel console-panel"><p class="eyebrow">Developer tools</p><h2>Console</h2><div id="console-output" class="console-output" aria-live="polite"></div><form id="console-form" class="console-form"><label for="console-input">Command</label><div class="console-input-row"><input id="console-input" autocomplete="off" placeholder="help" spellcheck="false"><button class="button" type="submit">Run</button></div></form><p class="help-text">Try: <code>biome</code>, <code>inspectcell 10 7</code>, <code>recipes</code>, or <code>tests</code>.</p></section>
      </aside>
    </section>
  </main>
  <script type="module" src="game.js"></script>
</body>
</html>
