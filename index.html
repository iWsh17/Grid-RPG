<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid RPG</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="game-container">
    <header class="game-header">
      <h1>Grid RPG</h1>
      <div class="header-controls">
        <span id="status-badge" class="status-badge">Loading...</span>
        <button id="reset-button" class="reset-button">Reset</button>
      </div>
    </header>

    <main class="game-main">
      <section class="game-section">
        <div id="grid" class="grid"></div>
        <div id="action-bar" class="action-bar" style="display: none;">
          <div class="action-bar-fill"></div>
          <span class="action-bar-text">Action...</span>
        </div>
      </section>

      <aside class="sidebar">
        <div class="panel">
          <h2>State Inspector</h2>
          <dl id="state-inspector" class="state-inspector"></dl>
        </div>

        <div class="panel">
          <h2>Inventory</h2>
          <div id="inventory-grid" class="inventory-grid"></div>
        </div>

        <div class="panel">
          <h2>Skills</h2>
          <div id="skills-list" class="skills-list"></div>
        </div>

        <div class="panel">
          <h2>Equipped</h2>
          <div id="equipped-slot" class="equipped-slot"></div>
        </div>

        <div class="panel">
          <h2>Console</h2>
          <form id="console-form" class="console-form">
            <input 
              type="text" 
              id="console-input" 
              class="console-input" 
              placeholder="Type 'help' for commands..."
              autocomplete="off"
            >
          </form>
          <div id="console-output" class="console-output"></div>
        </div>
      </aside>
    </main>
  </div>

  <script type="module" src="content.js"></script>
  <script type="module" src="Js/core/DataLoader.js"></script>
  <script type="module" src="Js/core/EventBus.js"></script>
  <script type="module" src="Js/core/Utils.js"></script>
  <script type="module" src="Js/core/GameState.js"></script>
  <script type="module" src="Js/core/WorldState.js"></script>
  <script type="module" src="Js/systems/InventorySystem.js"></script>
  <script type="module" src="Js/systems/SkillsSystem.js"></script>
  <script type="module" src="Js/systems/ToolSystem.js"></script>
  <script type="module" src="Js/systems/CraftingSystem.js"></script>
  <script type="module" src="Js/main.js"></script>
  <script type="module" src="Js/game.js"></script>
</body>
</html>
